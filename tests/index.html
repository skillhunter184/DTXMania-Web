<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DTXMania Web tests</title>
<style>
  body { font-family: Consolas, monospace; background: #111; color: #ddd; padding: 16px; }
  li.pass { color: #7f7; }
  li.fail { color: #f77; white-space: pre-wrap; }
  #summary { font-weight: bold; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="summary">running...</div>
<ul id="results"></ul>
<script type="module">
  // テストモジュールはキャッシュを避けるため毎回別 URL で読む
  const v = 'v=' + Date.now();
  // runner は各テストが './runner.js' として読む同じインスタンスを使う(クエリを付けると別モジュールになる)
  const { run } = await import('./runner.js');
  const files = ['core', 'game', 'clock', 'menu', 'renderer', 'gbrenderer', 'framepace', 'keybind', 'midi', 'gb', 'gamepad',
    'replay', 'integration', 'edit', 'editmodel', 'editview', 'editor', 'i18n'];
  // ?only=edit,core で一部のファイルだけ回す(作業中の確かめ用。全体は何も付けずに開く)
  const only = new URLSearchParams(location.search).get('only');
  for (const f of only ? files.filter((n) => only.split(',').includes(n)) : files) await import('./' + f + '.test.js?' + v);
  run();
</script>
</body>
</html>
